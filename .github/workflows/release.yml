name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: node scripts/verify-release-version.cjs "$GITHUB_REF_NAME"

  build:
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact: windows-x64
            files: |-
              release/*.exe
              release/*.blockmap
              release/latest.yml
            interactionSmoke: true
          - os: ubuntu-24.04
            script: build:linux
            artifact: linux-x64
            files: |-
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml
            interactionSmoke: false
          - os: macos-15
            script: build:mac
            artifact: macos-arm64
            files: |-
              release/*.dmg
              release/*.zip
            interactionSmoke: false
          - os: macos-15-intel
            script: build:mac
            artifact: macos-x64
            files: |-
              release/*.dmg
              release/*.zip
            interactionSmoke: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Windows'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 9.0.x
      - run: npm ci
      - if: matrix.interactionSmoke
        run: npm run test:input
      - if: matrix.interactionSmoke
        run: npm run test:ui
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  gamebar:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/gamebar-ci.yml
    with:
      release_package: true

  publish:
    needs: [build, gamebar]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Verify release payload
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-release-artifacts.cjs artifacts "${TAG#v}" --pre-checksum
      - name: Create and verify checksums
        working-directory: artifacts
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\0' \
            | sort -z \
            | xargs -0 -r sha256sum > SHA256SUMS.txt
          ! grep -Fq 'SHA256SUMS.txt' SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Verify final release payload
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-release-artifacts.cjs artifacts "${TAG#v}"
      - name: Publish verified draft atomically
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "NeoXider Agent Deck ${TAG}"
          fi
          gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          expected_count=$(find artifacts -mindepth 1 -maxdepth 1 -type f | wc -l)
          actual_count=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          test "$actual_count" -eq "$expected_count"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
