name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact: neoxider-agent-deck-windows-x64
            path: |-
              release/*.exe
              release/*.blockmap
              release/latest.yml
            uiSmoke: true
          - os: macos-15
            script: build:mac
            artifact: neoxider-agent-deck-macos-arm64
            path: |-
              release/*.dmg
              release/*.zip
            uiSmoke: false
          - os: macos-15-intel
            script: build:mac
            artifact: neoxider-agent-deck-macos-x64
            path: |-
              release/*.dmg
              release/*.zip
            uiSmoke: false
          - os: ubuntu-24.04
            script: build:linux
            artifact: neoxider-agent-deck-linux-x64
            path: |-
              release/*.AppImage
              release/*.deb
              release/*.blockmap
              release/latest-linux.yml
            uiSmoke: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Windows'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 9.0.x
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - if: matrix.uiSmoke
        run: npm run test:ui
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: matrix.uiSmoke
        with:
          name: widget-ui-smoke
          path: tmp/ui-smoke/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
