name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact: neoxider-agent-deck-windows-x64
            path: release/*.exe
            uiSmoke: true
          - os: macos-15
            script: build:mac
            artifact: neoxider-agent-deck-macos-arm64
            path: |-
              release/*.dmg
              release/*.zip
            uiSmoke: false
          - os: macos-15-intel
            script: build:mac
            artifact: neoxider-agent-deck-macos-x64
            path: |-
              release/*.dmg
              release/*.zip
            uiSmoke: false
          - os: ubuntu-24.04
            script: build:linux
            artifact: neoxider-agent-deck-linux-x64
            path: |-
              release/*.AppImage
              release/*.deb
            uiSmoke: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - if: matrix.uiSmoke
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: matrix.uiSmoke
        with:
          name: widget-ui-smoke
          path: tmp/ui-smoke/*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
